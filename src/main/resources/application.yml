
spring:
  application:
    name: ordering-service
  profiles:
    active: ${ENVIRONMENT:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordering}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  liquibase:
    change-log: db.changelog/db.changelog-master.yaml
    enabled: true
  output:
    ansi:
      enabled: ALWAYS
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USERNAME:dev}
    password: ${RABBIT_PASSWORD:dev}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  use-forward-headers: true
  forward-headers-strategy: framework
  main.allow-bean-definition-overriding: true
  servlet:
    encoding:
      charset: UTF-8
      force: true     # навязывать UTF-8 и для ответа, и для запроса
      enabled: true

app:
  info:
    application_name: ${PROJECT_NAME:ordering service}
    version: ${PROJECT_VERSION:1.0.0}
    description: ${PROJECT_DESCRIPTION:ordering Service}
    artifact_Id: ${PROJECT_ARTIFACTID:ordering-service}
    group_Id: ${PROJECT_GROUPID:ru.sogaz.site}
    app_profile: ${ENVIRONMENT:local}
    java-version: ${JAVA_VERSION:21}
  rabbit:
    orders-exchange: ${ORDER_EXCHANGE:order.exchange}
    payments-exchange: ${PAYMENT_EXCHANGE:payment.exchange}
    payments-completed-exchange: ${PAYMENT_COMPLETED_EXCHANGE:payment.completed.exchange}
    receipt-exchange: ${RECEIPT_EXCHANGE:receipt.exchange}
    queue-order: ${ORDER_CREATED_QUEUE:order.created.queue}
    queue-order-dlq: ${ORDER_CREATED_QUEUE_DLQ:order.created.queue.dlq} #DLQ
    queue-payment: ${PAYMENT_CREATED_QUEUE:payment.created.queue}
    queue-change-status-order: ${ORDER_STATUS_CHANGE_QUEUE:order.status.change.queue}
    queue-send-receipt-order: ${ORDER_RECEIPT_SEND_QUEUE:order.receipt.send.queue}
    routing-key-order: ${ROUTING_KEY_ORDER_CREATED:order.created}
    routing-key-order-dlq: ${ROUTING_KEY_ORDER_CREATED_DLQ:order.created.dlq}
    routing-key-payment: ${ROUTING_KEY_PAYMENT_CREATED:payment.created}
    routing-key-receipt: ${ROUTING_KEY_RECEIPT_REQUESTED:receipt.requested}
    listener:
      batch-size: 100
      prefetch: 100
      concurrency: 3
      max-concurrency: 10
  payment:
    client:
      basePath: https://test-gateway-site-dmz.sogaz.ru

api:
  payment:
    paymentUrl: ${PAYMENT_URL:STUB}

resilience4j:
  retry:
    instances:
      rabbitConsumerRetry:
        maxAttempts: ${RABBIT_CONSUMER_RETRY_MAX_ATTEMPTS:4}
        waitDuration: ${RABBIT_CONSUMER_RETRY_INITIAL_WAIT_DURATIONS:10s}
        enableExponentialBackoff: ${RABBIT_CONSUMER_RETRY_EXPONENTIAL:true}
        exponentialBackoffMultiplier: ${RABBIT_CONSUMER_RETRY_WAIT_MULTIPLAYER:10}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${HOSTNAME:localhost}
    export:
      prometheus:
        enabled: true

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_SERVICE_PORT:8091}
  health:
    livenessState:
      enable: true
    readinessState:
      enable: true
