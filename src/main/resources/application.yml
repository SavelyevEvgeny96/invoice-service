
spring:
  application:
    name: ordering-service
  profiles:
    active: ${ENVIRONMENT:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordering}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  liquibase:
    change-log: db.changelog/db.changelog-master.yaml
    enabled: true
  output:
    ansi:
      enabled: ALWAYS
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  use-forward-headers: true
  forward-headers-strategy: framework
  main.allow-bean-definition-overriding: true
  servlet:
    encoding:
      charset: UTF-8
      force: true     # навязывать UTF-8 и для ответа, и для запроса
      enabled: true

app:
  info:
    application_name: ${PROJECT_NAME:ordering service}
    version: ${PROJECT_VERSION:1.0.0}
    description: ${PROJECT_DESCRIPTION:ordering Service}
    artifact_Id: ${PROJECT_ARTIFACTID:ordering-service}
    group_Id: ${PROJECT_GROUPID:ru.sogaz.site}
    app_profile: ${ENVIRONMENT:local}
    java-version: ${JAVA_VERSION:21}
  rabbit:
    orders-exchange: ${ORDER_EXCHANGE:order.exchange}
    receipt-exchange: ${RECEIPT_EXCHANGE:receipt.exchange}
    payments-exchange: ${PAYMENT_EXCHANGE:payment.exchange}
    queue-order: ${ORDER_CREATED_QUEUE:order.created.queue}
    queue-order-refund: ${ORDER_CREATED_REFUND_QUEUE:order.refund.queue}
    queue-payment-status-refund: ${PAYMENT_STATUS_REFUND_QUEUE:payment.status.refund.queue}
    queue-order-dlq: ${ORDER_CREATED_QUEUE_DLQ:order.created.queue.dlq} #DLQ
    queue-payment: ${PAYMENT_CREATED_QUEUE:payment.created.queue}
    queue-change-status-order: ${ORDER_STATUS_CHANGE_QUEUE:order.status.change.queue}
    queue-send-status-order: ${ORDER_STATUS_SEND_QUEUE:order.status.send.queue}
    queue-send-status-refund-order: ${ORDER_REFUND_STATUS_QUEUE:order.refund.status.send.queue}
    queue-send-receipt-order: ${ORDER_RECEIPT_SEND_QUEUE:order.receipt.send.queue}
    queue-fill-history-payment-order: ${ORDER_PAYMENT_HISTORY_FILL_QUEUE:order.payment.history.fill.queue}
    queue-fill-history-receipts: ${RECEIPT_SENT_QUEUE:receipt.sent.queue}
    routing-key-order: ${ROUTING_KEY_ORDER_CREATED:order.created}
    routing-key-order-dlq: ${ROUTING_KEY_ORDER_CREATED_DLQ:order.created.dlq}
    routing-key-order-refund: ${ROUTING_KEY_ORDER_CREATED:order.refund.created}
    routing-key-payment: ${ROUTING_KEY_PAYMENT_CREATED:payment.created}
    routing-key-receipt: ${ROUTING_KEY_RECEIPT_REQUESTED:receipt.requested}
    routing-key-refund-payment: ${ROUTING_KEY_REFUND_PAYMENT_CREATED:payment.refund.created}
    routing-key-payment-status-refund: ${ROUTING_KEY_PAYMENT_STATUS_REFUND_QUEUE:payment.status.refund.created}
    routing-key-payment-receipt-create-check: ${ROUTING_KEY_PAYMENT_RECEIPT_CHECK_QUEUE:receipt.created}
    listener:
      batch-size: 50
      prefetch: 50
      concurrency: 1
      max-concurrency: 1
  client:
    payment:
      basePath: ${PAYMENT_SERVICE_BASE_PATH:https://s00-0000-k835.sogaz.ru/test/payment-service/}
    qr:
      basePath: ${QR_GENERATOR_SERVICE_BASE_PATH:https://s00-0000-k835.sogaz.ru/test/qr-generator-service}

api:
  payment:
    paymentUrl: ${PAYMENT_URL:https://test-gateway-site-kis.sogaz.ru/payment/pay/}
    paymentSbpUrl: ${PAYMENT_SBP_URL:https://test-gateway-site-kis.sogaz.ru/payment/paySbp/}
    isSbpActive: ${PAYMENT_SBP_ACTIVE:true}
    isQrGeneratorActive: ${QR_GENERATOR_ACTIVE:false}
    qrCodeSize: ${QR_GENERATOR_CODE_SIZE:512}

resilience4j:
  retry:
    instances:
      rabbitConsumerRetry:
        maxAttempts: ${RABBIT_CONSUMER_RETRY_MAX_ATTEMPTS:4}
        waitDuration: ${RABBIT_CONSUMER_RETRY_INITIAL_WAIT_DURATIONS:10s}
        enableExponentialBackoff: ${RABBIT_CONSUMER_RETRY_EXPONENTIAL:true}
        exponentialBackoffMultiplier: ${RABBIT_CONSUMER_RETRY_WAIT_MULTIPLAYER:5}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${HOSTNAME:localhost}
    export:
      prometheus:
        enabled: true

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  server:
    port: ${MANAGEMENT_SERVICE_PORT:8091}
  health:
    livenessState:
      enable: true
    readinessState:
      enable: true

logging:
  level:
    org.springframework.jdbc: ${LOG_JDBC_LEVEL:INFO}
    org.springframework.transaction: ${LOG_TRANSACTION_LEVEL:INFO}
#    org.springframework.amqp.rabbit.*: DEBUG
    logging.level.org.hibernate.engine.jdbc.batch.internal: ${LOG_JDBC_BATCH:INFO}

  rabbit:
    enabled: ${LOGGING_RABBIT_ENABLED:true}
    log-body: ${LOGGING_RABBIT_LOG_BODY:true}
    confirms-enabled: ${LOGGING_RABBIT_CONFIRMS_ENABLED:false}
    returns-enabled: ${LOGGING_RABBIT_RETURNS_ENABLED:false}
crons:
  overdue:
    cron: ${CRON_JOB_STATUS_ORDERS:0 0 * * * *}

logstash:
  host: ${LOG_SERVER_HOST:localhost}
  port: ${LOG_SERVER_PORT:12201}
  level: ${LOG_LEVEL:INFO}
  level_local: ${LOG_LEVEL_LOCAL:INFO}
